<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root { --bg: var(--figma-color-bg, #fff); --fg: var(--figma-color-text, #222); --muted: var(--figma-color-text-secondary, #777);
          --border: var(--figma-color-border, #ddd); --brand: var(--figma-color-bg-brand, #0d99ff); --onbrand: var(--figma-color-text-onbrand, #fff); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--fg); }
  h2 { font-size: 12px; margin: 14px 0 6px; color: var(--muted); font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  select, input, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; }
  textarea { width: 100%; height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  button { cursor: pointer; }
  button.primary { background: var(--brand); color: var(--onbrand); border-color: var(--brand); }
  button:disabled { opacity: .5; cursor: default; }
  .steps button { flex: 1 1 45%; text-align: left; }
  .wide { width: 100%; }
  #drop { border: 1px dashed var(--border); border-radius: 4px; padding: 10px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 6px; }
  #drop.over { border-color: var(--brand); color: var(--fg); }
  #drop input { display: none; }
  #imgInfo { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  details { margin: 4px 0 6px; }
  summary { cursor: pointer; color: var(--muted); margin-bottom: 6px; }
  #log { height: 190px; overflow-y: auto; border: 1px solid var(--border); border-radius: 4px; padding: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; }
  .info { color: var(--fg); } .ok { color: #1a9a4b; } .warn { color: #c98500; } .error { color: #e03e3e; }
  input[type=number] { width: 56px; }
</style>
</head>
<body>
  <h2>폰트</h2>
  <div class="row">
    <select id="family">
      <option>Apple SD Gothic Neo</option>
      <option>Noto Sans KR</option>
    </select>
    <button data-step="applyFont">폰트만 적용</button>
  </div>

  <h2>디자인 시스템 만들기 (순서대로, 몇 번이든 다시 실행 가능)</h2>
  <div class="row steps">
    <button data-step="ensureFoundations">1. Foundations</button>
    <button data-step="buildAtoms">2. Atoms</button>
    <button data-step="buildBlocks">3. Blocks</button>
    <button data-step="buildTemplates">4. Templates</button>
  </div>

  <h2>내용 채우기</h2>
  <textarea id="json" spellcheck="false" placeholder='여기에 content JSON 전체를 붙여넣으세요 (docs/kb.json 형식).
예: { "profile": { "name": "...", ... }, "resume": { ... }, "coverLetter": { ... }, "portfolio": { "cover": { ... }, "details": [ ... ] } }'></textarea>
  <label id="drop" title="JSON 의 photo / image 값이 파일 이름일 때 이 폴더에서 찾습니다">
    이미지 폴더 선택/드롭
    <input id="folder" type="file" multiple webkitdirectory>
  </label>
  <div id="imgInfo">선택한 이미지 없음. URL·data URI 이미지는 폴더 없이도 들어갑니다.</div>
  <div class="row">
    <label for="accent">강조색</label>
    <input id="accent" type="color" value="#f9af00">
    <span id="accentHint" style="color:var(--muted);font-size:11px">JSON 에 theme.accent 가 있으면 그 값이 우선</span>
  </div>
  <div class="row">
    <button class="primary wide" data-step="buildAll">5. Build all (JSON 전체)</button>
  </div>
  <details>
    <summary>advanced: 템플릿 하나만 채우기</summary>
    <div class="row">
      <select id="which">
        <option value="resume">이력서 (resume)</option>
        <option value="coverLetter">자기소개서 (coverLetter)</option>
        <option value="portfolioCover">포트폴리오 표지 (portfolioCover)</option>
        <option value="portfolioDetail">포트폴리오 상세 (portfolioDetail)</option>
      </select>
      <label id="indexWrap">details[<input id="index" type="number" min="0" value="0">]</label>
      <button data-step="fillTemplate">Fill template</button>
    </div>
  </details>

  <h2>내보내기</h2>
  <div class="row">
    <button data-step="exportSelectionPNG">6. 선택한 페이지 PNG 내보내기</button>
    <button data-step="freezeSelectionColors" title="선택한 페이지의 강조색·본문색 변수 연결을 풀고 지금 색을 그대로 박아 둡니다">선택한 페이지 색 고정</button>
  </div>

  <h2>로그 <button id="clear" style="float:right;padding:0 6px">지우기</button></h2>
  <div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const logEl = $('log');
  const buttons = Array.from(document.querySelectorAll('button[data-step]'));
  const IMAGE_RE = /\.(png|jpe?g|gif|webp)$/i;
  const files = new Map();

  try { const saved = localStorage.getItem('kb-json'); if (saved) $('json').value = saved; } catch (e) {}
  try { const fam = localStorage.getItem('kb-family'); if (fam) $('family').value = fam; } catch (e) {}
  try { const ac = localStorage.getItem('kb-accent'); if (ac) $('accent').value = ac; } catch (e) {}
  $('accent').addEventListener('change', () => { try { localStorage.setItem('kb-accent', $('accent').value); } catch (e) {} });

  function log(level, msg) {
    const line = document.createElement('div');
    line.className = level;
    const t = new Date().toTimeString().slice(0, 8);
    line.textContent = `[${t}] ${msg}`;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setBusy(b) { buttons.forEach((x) => { x.disabled = b; }); }

  function syncIndex() { $('indexWrap').style.display = $('which').value === 'portfolioDetail' ? '' : 'none'; }
  $('which').addEventListener('change', syncIndex);
  syncIndex();

  $('family').addEventListener('change', () => { try { localStorage.setItem('kb-family', $('family').value); } catch (e) {} });
  $('json').addEventListener('change', () => { try { localStorage.setItem('kb-json', $('json').value); } catch (e) {} });
  $('clear').addEventListener('click', () => { logEl.textContent = ''; });

  function baseName(v) { return String(v).split(/[?#]/)[0].split(/[\\/]/).pop(); }

  function updateImgInfo() {
    $('imgInfo').textContent = files.size
      ? `이미지 ${files.size}개 준비됨 (창을 닫으면 다시 선택해야 합니다)`
      : '선택한 이미지 없음. URL·data URI 이미지는 폴더 없이도 들어갑니다.';
  }

  async function addFile(f) {
    if (!f || !IMAGE_RE.test(f.name)) return;
    try { files.set(f.name, new Uint8Array(await f.arrayBuffer())); }
    catch (e) { log('warn', `이미지 읽기 실패: ${f.name} — ${e.message || e}`); }
  }

  function entryFile(entry) { return new Promise((res) => entry.file(res, () => res(null))); }
  function readBatch(reader) { return new Promise((res) => reader.readEntries(res, () => res([]))); }
  async function addEntry(entry) {
    if (!entry) return;
    if (entry.isFile) { await addFile(await entryFile(entry)); return; }
    if (!entry.isDirectory) return;
    const reader = entry.createReader();
    for (;;) {
      const batch = await readBatch(reader);
      if (!batch.length) break;
      for (const e of batch) await addEntry(e);
    }
  }

  $('folder').addEventListener('change', async (e) => {
    for (const f of Array.from(e.target.files || [])) await addFile(f);
    e.target.value = '';
    updateImgInfo();
    log('info', `이미지 폴더: 이미지 ${files.size}개`);
  });
  const drop = $('drop');
  ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
  drop.addEventListener('drop', async (e) => {
    e.preventDefault();
    const dt = e.dataTransfer;
    const entries = Array.from(dt.items || []).map((it) => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null)).filter(Boolean);
    const plain = Array.from(dt.files || []);
    if (entries.length) { for (const en of entries) await addEntry(en); }
    else { for (const f of plain) await addFile(f); }
    updateImgInfo();
    log('info', `드롭한 이미지: 총 ${files.size}개`);
  });

  function b64ToBytes(b64) {
    const bin = atob(b64.replace(/\s+/g, ''));
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function imageRefs(json) {
    const out = [];
    const push = (v) => { if (typeof v === 'string' && v.trim()) out.push(v.trim()); };
    if (json.resume) push(json.resume.logo);
    if (json.coverLetter) push(json.coverLetter.photo);
    const pf = json.portfolio || {};
    if (pf.cover) push(pf.cover.photo);
    (Array.isArray(pf.details) ? pf.details : []).forEach((t) => {
      ((t && Array.isArray(t.projects)) ? t.projects : []).forEach((pr) => {
        if (!pr) return;
        push(pr.image);
        (Array.isArray(pr.blocks) ? pr.blocks : []).forEach((b) => {
          if (!b) return;
          push(b.src);
          (Array.isArray(b.items) ? b.items : []).forEach((it) => push(it && it.src));
        });
      });
    });
    return out;
  }

  // Only images referenced by the JSON are sent, keyed by basename (files) or the data URI itself.
  function collectImages(json) {
    const images = {};
    const missing = [];
    for (const ref of imageRefs(json)) {
      if (/^https?:\/\//i.test(ref)) continue;
      if (/^data:/i.test(ref)) {
        const m = /^data:[^,]*;base64,([\s\S]*)$/i.exec(ref);
        if (!m) { log('warn', 'base64 가 아닌 data URI 는 지원하지 않습니다.'); continue; }
        try { images[ref] = b64ToBytes(m[1]); } catch (e) { log('warn', `data URI 디코딩 실패: ${e.message || e}`); }
        continue;
      }
      const base = baseName(ref);
      if (files.has(base)) images[base] = files.get(base);
      else if (!missing.includes(base)) missing.push(base);
    }
    if (missing.length) log('warn', `폴더에서 찾지 못한 이미지 ${missing.length}개 (해당 자리는 숨김): ${missing.join(', ')}`);
    return images;
  }

  buttons.forEach((btn) => btn.addEventListener('click', () => {
    const step = btn.dataset.step;
    const msg = { type: 'run', step, family: $('family').value };
    if (step === 'fillTemplate' || step === 'buildAll') {
      const text = $('json').value.trim();
      if (!text) { log('error', 'JSON 이 비어 있습니다. 먼저 content JSON 을 붙여넣으세요.'); return; }
      let json;
      try { json = JSON.parse(text); } catch (e) { log('error', 'JSON 문법 오류: ' + e.message); return; }
      try { localStorage.setItem('kb-json', $('json').value); } catch (e) {}
      msg.json = text;
      msg.images = collectImages(json);
      msg.accent = $('accent').value;
      if (step === 'fillTemplate') {
        msg.which = $('which').value;
        msg.index = parseInt($('index').value, 10) || 0;
      }
    }
    setBusy(true);
    parent.postMessage({ pluginMessage: msg }, '*');
  }));

  function download(name, bytes) {
    const safe = String(name).replace(/[\\/:*?"<>|]+/g, '_') || 'export';
    const blob = new Blob([bytes], { type: 'image/png' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = safe + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    log('ok', `다운로드: ${safe}.png`);
  }

  window.onmessage = (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'log') log(msg.level, msg.msg);
    else if (msg.type === 'done') setBusy(false);
    else if (msg.type === 'png') download(msg.name, msg.bytes);
  };
</script>
</body>
</html>
